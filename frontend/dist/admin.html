<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - TradeFlow</title>
    <script>
        // Check if logged in as admin
        const token = localStorage.getItem('token');
        const userData = JSON.parse(localStorage.getItem('user') || '{}');
        
        if (token && userData.role === 'admin') {
            // Already logged in as admin, go to admin dashboard
            window.location.href = '/admin';
        } else {
            // Not logged in, go to admin login
            window.location.href = '/admin-login.html';
        }
    </script>
</head>
<body style="background:#0a0b0e;color:#e8eaed;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;">
    <div style="text-align:center;">
        <div style="font-size:40px;">👑</div>
        <p>Redirecting to admin panel...</p>
    </div>
</body>
</html>
